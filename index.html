<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>11:00 PM</title>
  <link rel="stylesheet" href="css/menu.css" />
</head>
<body>

  <div id="menu-container">
    <h1 class="game-title">11:00 PM</h1>
    <p class="tagline">The computer doesn’t want you to leave.</p>

    <div class="menu-buttons">
      <button id="newGameBtn">New Game</button>
      <button id="settingsBtn">Settings</button>
      <button id="creditsBtn">Credits</button>
      <button id="quitBtn">Quit</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Settings</h2>
      <p>(Coming soon)</p>
      <button class="closeModal">Close</button>
    </div>
  </div>

  <!-- Credits Modal -->
  <div id="creditsModal" class="modal hidden">
    <div class="modal-content">
      <h2>Credits</h2>
      <p>Created by Shabaz shaikh</p>
      <p>This system was not meant to be used alone.</p>
      <button class="closeModal">Close</button>
    </div>
  </div>
  

  <script src="js/menu.js"></script>
</body>
</html>
